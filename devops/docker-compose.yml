services:
  db:
    image: postgres:16-alpine
    container_name: esprit-market-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: esprit_market
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d esprit_market"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend-network

  eureka:
    build:
      context: ../backend
      dockerfile: Dockerfile.service
      args:
        MODULE: eureka-server
    image: espritmarket/eureka-server:${IMAGE_TAG:-latest}
    container_name: esprit-market-eureka
    restart: unless-stopped
    environment:
      SPRING_APPLICATION_NAME: eureka-server
      SERVER_PORT: "8761"
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - backend-network

  auth:
    build:
      context: ../backend
      dockerfile: Dockerfile.service
      args:
        MODULE: esprit-auth
    image: espritmarket/esprit-auth:${IMAGE_TAG:-latest}
    container_name: esprit-market-auth
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      eureka:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: esprit-auth
      SERVER_PORT: "8081"
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/esprit_market
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_FLYWAY_ENABLED: "true"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      GATEWAY_SHARED_TOKEN: ${GATEWAY_SHARED_TOKEN:-esprit-internal-token-change-me}
      JWT_SECRET: ${JWT_SECRET:-}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - backend-network

  marketplace:
    build:
      context: ../backend
      dockerfile: Dockerfile.service
      args:
        MODULE: esprit-marketplace
    image: espritmarket/esprit-marketplace:${IMAGE_TAG:-latest}
    container_name: esprit-market-marketplace
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      eureka:
        condition: service_healthy
      auth:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    environment:
      SPRING_APPLICATION_NAME: esprit-marketplace
      SERVER_PORT: "8082"
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/esprit_market
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      GATEWAY_SHARED_TOKEN: ${GATEWAY_SHARED_TOKEN:-esprit-internal-token-change-me}
      JWT_SECRET: ${JWT_SECRET:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      APP_UPLOAD_DIR: /app/uploads
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - backend-network

  srv:
    build:
      context: ../backend
      dockerfile: Dockerfile.service
      args:
        MODULE: esprit-srv
    image: espritmarket/esprit-srv:${IMAGE_TAG:-latest}
    container_name: esprit-market-srv
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      eureka:
        condition: service_healthy
      auth:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    environment:
      SPRING_APPLICATION_NAME: esprit-srv
      SERVER_PORT: "8083"
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/esprit_market
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      GATEWAY_SHARED_TOKEN: ${GATEWAY_SHARED_TOKEN:-esprit-internal-token-change-me}
      JWT_SECRET: ${JWT_SECRET:-}
      APP_UPLOAD_DIR: /app/uploads
      SRV_UPLOAD_DIR: /app/uploads/srv-images
      SRV_DELIVERABLE_UPLOAD_DIR: /app/uploads/deliverables
      SRV_BOOKING_UPLOAD_DIR: /app/uploads/bookings
      ML_SERVICE_URL: http://ml-service:8000
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - backend-network

  eventplanning:
    build:
      context: ../backend
      dockerfile: Dockerfile.service
      args:
        MODULE: esprit-eventplanning
    image: espritmarket/esprit-eventplanning:${IMAGE_TAG:-latest}
    container_name: esprit-market-eventplanning
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      eureka:
        condition: service_healthy
      auth:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: esprit-eventplanning
      SERVER_PORT: "8084"
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/esprit_market
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      GATEWAY_SHARED_TOKEN: ${GATEWAY_SHARED_TOKEN:-esprit-internal-token-change-me}
      JWT_SECRET: ${JWT_SECRET:-}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      EVENT_NOTIFICATION_EMAILS: ${EVENT_NOTIFICATION_EMAILS:-}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - backend-network

  partnership:
    build:
      context: ../backend
      dockerfile: Dockerfile.service
      args:
        MODULE: esprit-partnership
    image: espritmarket/esprit-partnership:${IMAGE_TAG:-latest}
    container_name: esprit-market-partnership
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      eureka:
        condition: service_healthy
      auth:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: esprit-partnership
      SERVER_PORT: "8085"
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/esprit_market
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      GATEWAY_SHARED_TOKEN: ${GATEWAY_SHARED_TOKEN:-esprit-internal-token-change-me}
      JWT_SECRET: ${JWT_SECRET:-}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8085/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - backend-network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.service
      args:
        MODULE: esprit-gateway
    image: espritmarket/esprit-gateway:${IMAGE_TAG:-latest}
    container_name: esprit-market-gateway
    restart: unless-stopped
    depends_on:
      eureka:
        condition: service_healthy
      auth:
        condition: service_healthy
      marketplace:
        condition: service_healthy
      srv:
        condition: service_healthy
      eventplanning:
        condition: service_healthy
      partnership:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: esprit-gateway
      SERVER_PORT: "8088"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      GATEWAY_SHARED_TOKEN: ${GATEWAY_SHARED_TOKEN:-esprit-internal-token-change-me}
      JWT_SECRET: ${JWT_SECRET:-}
    ports:
      - "8088:8088"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8088/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - backend-network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: esprit-market-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:8080"
    networks:
      - backend-network

  ml-service:
    build:
      context: ../ml-service
      dockerfile: Dockerfile
    container_name: esprit-market-ml
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ML_DB_PASSWORD: ${ML_DB_PASSWORD:-postgres}
      ML_DB_URL: postgresql://postgres:${ML_DB_PASSWORD:-postgres}@db:5432/esprit_market
      BOOKING_MODEL_PATH: models/booking_completion_model.joblib
      PROJECT_MODEL_PATH: models/project_delay_model.joblib
      SENTIMENT_MODEL_PATH: models/sentiment_model.joblib
      ML_DATA_DIR: data
      RETRAIN_THRESHOLD: 5
    ports:
      - "8000:8000"
    networks:
      - backend-network

  prometheus:
    image: prom/prometheus:v2.48.1
    container_name: esprit-market-prometheus
    restart: unless-stopped
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    ports:
      - "9090:9090"
    networks:
      - backend-network

  grafana:
    image: grafana/grafana:10.2.0
    container_name: esprit-market-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - backend-network

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  backend-network:
    driver: bridge
